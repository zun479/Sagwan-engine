# 릴리스 만드는 방법 두 가지 (둘 다 결과는 Releases의 "초안"):
#  1) GitHub 웹: Actions → release → [Run workflow] → 버전(예: 0.1.0) 입력
#  2) 명령줄: git tag v0.1.0 && git push origin v0.1.0
# 초안을 열어 확인한 뒤 [Publish release]를 누르면 공개되고, 그때 태그가 만들어진다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.1.0, 0.2.0-beta.1). 비우면 빌드만 하고 릴리스는 만들지 않음'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: apps/hub/go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 패키지 설치 (워크스페이스 연결 포함)
        shell: bash
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: 엔진 테스트
        shell: bash
        run: |
          node --test "packages/shared/test/*.test.ts" "apps/api/test/*.test.ts"
          cd apps/hub && go test ./...

      - name: 버전 정하기
        id: v
        shell: bash
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE=false
          if [[ -n "$INPUT" ]]; then TAG="v${INPUT#v}"; RELEASE=true;
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE=true;
          else TAG="v0.0.0-dev"; fi
          V="${TAG#v}"
          NUM="${V%%-*}"
          [[ "$NUM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "태그는 v1.2.3 형식이어야 합니다: $TAG"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: exe에 아이콘·버전 정보 넣기
        working-directory: apps/hub
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --product-version ${{ steps.v.outputs.num }}.0 --file-version ${{ steps.v.outputs.num }}.0

      - name: Wiki Hub 빌드
        working-directory: apps/hub
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ steps.v.outputs.version }} -X main.repo=${{ github.repository }}" -o build/WikiHub.exe .

      - name: 설치 프로그램 만들기 (NSIS)
        working-directory: apps/hub/build
        shell: pwsh
        run: |
          $m = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $m) { $m = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $m)) { choco install nsis -y --no-progress; $m = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $m /V3 /DVERSION=${{ steps.v.outputs.version }} /DVERNUM=${{ steps.v.outputs.num }} installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 엔진 소스 묶음 · 체크섬
        shell: bash
        run: |
          git archive --format=zip --prefix=sagwan-engine/ -o "apps/hub/build/sagwan-engine-${{ steps.v.outputs.version }}.zip" HEAD
          cd apps/hub/build
          sha256sum WikiHub-Setup-*.exe sagwan-engine-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Releases에 초안 올리기
        if: steps.v.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "${{ steps.v.outputs.version }}" == *-* ]] && PRE="--prerelease"
          gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" \
            apps/hub/build/WikiHub-Setup-*.exe \
            apps/hub/build/sagwan-engine-*.zip \
            apps/hub/build/SHA256SUMS.txt \
            --draft $PRE --title "Sagwan Engine ${{ steps.v.outputs.tag }}" --notes-file docs/RELEASE_NOTES.md

      - name: 수동 실행 결과물 보관
        if: steps.v.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wikihub-${{ steps.v.outputs.version }}
          path: |
            apps/hub/build/WikiHub-Setup-*.exe
            apps/hub/build/SHA256SUMS.txt
